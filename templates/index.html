<!DOCTYPE html>
<html>

<head>

    <title>AI Study Assistant</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <!-- Markdown formatting -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Security for generated HTML -->
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>

</head>

<body>

    <div class="container">

        <h1>AI Study Assistant</h1>

        <p class="subtitle">
            Learn smarter with AI
        </p>

        <form action="/ask" method="POST">

            <label for="mode">
                Choose Study Mode
            </label>

            <select name="mode" id="mode">

                <option value="explain"
                    {% if selected_mode == "explain" %}selected{% endif %}>
                    Explain a Topic
                </option>

                <option value="summarize"
                    {% if selected_mode == "summarize" %}selected{% endif %}>
                    Summarize
                </option>

                <option value="quiz"
                    {% if selected_mode == "quiz" %}selected{% endif %}>
                    Quiz Me
                </option>

                <option value="doubt"
                    {% if selected_mode == "doubt" %}selected{% endif %}>
                    Ask a Doubt
                </option>

            </select>

            <textarea
                name="question"
                placeholder="Enter your topic or question..."
                required
            >{{ question if question else "" }}</textarea>

            <button type="submit">
                Ask AI
            </button>

            <a href="/clear" class="clear-button">
                Clear Conversation
            </a>

        </form>

        {% if answer %}

        <div class="answer">

            <h2>AI Response</h2>

            <p>
                <strong>Your question:</strong>
            </p>

            <p>{{ question }}</p>

            <hr>

            <!-- AI answer will be converted from Markdown -->
            <div id="ai-answer" class="ai-answer"></div>

            <!-- Store the AI answer safely -->
            <script id="answer-data" type="text/plain">{{ answer }}</script>

        </div>

        <script>

            const rawAnswer =
                document.getElementById("answer-data").textContent;

            const formattedAnswer =
                marked.parse(rawAnswer);

            document.getElementById("ai-answer").innerHTML =
                DOMPurify.sanitize(formattedAnswer);

        </script>

        {% endif %}

    </div>

</body>

</html>
