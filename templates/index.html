<!DOCTYPE html>
<html>

<head>

    <title>AI Study Assistant</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="container">

        <h1>AI Study Assistant</h1>

        <p class="subtitle">
            Learn smarter with AI
        </p>

        <form action="/ask" method="POST">

            <label for="mode">
                Choose Study Mode
            </label>

            <select name="mode" id="mode">

                <option value="explain">
                    Explain a Topic
                </option>

                <option value="summarize">
                    Summarize
                </option>

                <option value="quiz">
                    Quiz Me
                </option>

                <option value="doubt">
                    Ask a Doubt
                </option>

            </select>

            <textarea
                name="question"
                placeholder="Enter your topic or question..."
                required
            ></textarea>

            <button type="submit">
                Ask AI
            </button>

        </form>

        {% if answer %}

        <div class="answer">

            <h2>AI Response</h2>

            <p>
                <strong>Your question:</strong>
            </p>

            <p>{{ question }}</p>

            <hr>

            <div class="ai-answer">
                {{ answer }}
            </div>

        </div>

        {% endif %}

    </div>

</body>

</html>
